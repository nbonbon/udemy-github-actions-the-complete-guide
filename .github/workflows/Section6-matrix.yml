name: Section 6 - Matrix Demo
on: push
jobs:
  build:
    continue-on-error: true # this will allow the job to continue even if one of the matrix combinations fails
    strategy:
      matrix:
        node-version: [20, 22]
        operating-system: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.operating-system }}
    steps:
      - name: Get code
        uses: actions/checkout@v3
      - name: Install NodeJS
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install Dependencies
        run: npm ci
        working-directory: 04 Practice Project (Start)/
      - name: Build Project
        run: npm run build
        working-directory: 04 Practice Project (Start)/