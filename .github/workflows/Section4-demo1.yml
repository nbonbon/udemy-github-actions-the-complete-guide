name: Section 4 - Events Demo 1
on: 
  pull_request:
      types: 
        - opened
      branches:
        - main
        - 'dev-*' # dev-new dev-this-is-new
        - 'feat/**' # feat/new feat/new/button
  workflow_dispatch:
  push:
    branches:
      - main
      - 'dev-*' # dev-new dev-this-is-new
      - 'feat/**' # feat/new feat/new/button
    paths-ignore:
      - './github/workflows/*' # Targetted if we change one of the branches above but only if you did not change any files in workflows
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Output event data
        run: echo "${{ toJSON(github.event) }}"
      - name: Get code
        uses: actions/checkout@v3
      - name: Install dependencies
        run: npm ci
        working-directory: ./04 Practice Project (Start)/
      - name: Test code
        run: npm run test
        working-directory: ./04 Practice Project (Start)/
      - name: Build code
        run: npm run build
        working-directory: ./04 Practice Project (Start)/
      - name: Deploy project
        run: echo "Deploying..."
        working-directory: ./04 Practice Project (Start)/