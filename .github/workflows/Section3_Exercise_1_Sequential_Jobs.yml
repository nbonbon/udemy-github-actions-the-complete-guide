name: Section 3 Exercise Sequential Jobs
on: workflow_dispatch
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v3
      - name: Install Dependencies
        run: npm ci
        working-directory: ./04 Practice Project (Start)/
      - name: lint
        run: |
          npm run lint
        working-directory: ./04 Practice Project (Start)/
  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v3
      - name: Install Dependencies
        run: npm ci
        working-directory: ./04 Practice Project (Start)/
      - name: test
        run: |
          npm run test
        working-directory: ./04 Practice Project (Start)/
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v3
      - name: Install Dependencies
        run: npm ci
        working-directory: ./04 Practice Project (Start)/
      - name: build
        run: |
          npm run build
        working-directory: ./04 Practice Project (Start)/
