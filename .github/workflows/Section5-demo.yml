name: Section 5 - Deploy website
on:
  push:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v3
      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm # Depends on the kind of code and build system you are using
          key: deps-node-modules-${{ hashFiles('**/package-lock.json') }} 
          # Key will be used to be retrieved in the future
          # Hashes dependencies according to hash of the package.json which will be updated if there are new dependencies
      - name: Install dependencies
        run: npm ci
        working-directory: ./04 Practice Project (Start)/
      - name: Lint code
        run: npm run lint
        working-directory: ./04 Practice Project (Start)/
      - name: Test code
        run: npm run test
        working-directory: ./04 Practice Project (Start)/
  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
        script-file: ${{ steps.publish.outputs.script-file }} # outputs name has to match value written to $GITHUB_OUTPUT in the actual step below
    steps:
      - name: Get code
        uses: actions/checkout@v3
      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm # Depends on the kind of code and build system you are using
          key: deps-node-modules-${{ hashFiles('**/package-lock.json') }} 
          # Key will be used to be retrieved in the future
          # Hashes dependencies according to hash of the package.json which will be updated if there are new dependencies
      - name: Install dependencies
        run: npm ci
        working-directory: ./04 Practice Project (Start)/
      - name: Build website
        run: npm run build
        working-directory: ./04 Practice Project (Start)/
      - name: Publish JS filename
        id: publish
        run: find dist/assets/*.js -type f -execdir echo 'script-file={}' >> $GITHUB_OUTPUT ';'
        working-directory: ./04 Practice Project (Start)/
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-files # what to name the uploaded artifact
          path: ./04 Practice Project (Start)/dist # where to find the files to upload
          # path: | # multiple files example
          #   dist 
          #   package.json # just here to show an example of uploading multiple files
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Get build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist-files # should match the name above. Will download and unzip.
      - name: Output contents
        run: ls # wont show dist folder. Will have all the files themselves in the current directory.
      - name: Output filename # Output value from build job
        run: echo "${{ needs.build.outputs.script-file }}"
      - name: Deploy
        run: echo "Deploying..."
