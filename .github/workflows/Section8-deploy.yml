name: Deployment (Container)
on:
  push:
    branches:
      - main
      - dev
env:
  CACHE_KEY: node-deps
  MONGODB_DB_NAME: gha-demo
jobs:
  test:
    environment: testing
    runs-on: ubuntu-latest
    container: 
      image: node:20 # uses the latest node version 16 docker container image from docker hub
    env:
      MONGODB_CONNECTION_PROTOCOL: mongodb
      MONGODB_CLUSTER_ADDRESS: mongodb # Can use the mongodb service name as the connection string 
      MONGODB_USERNAME: root
      MONGODB_PASSWORD: example
      PORT: 8080
    services: # Setup services container for MongoDB
      mongodb:
        image: mongo
        env:
          MONGO_INITDB_ROOT_USERNAME: root
          MONGO_INITDB_ROOT_PASSWORD: example
    steps:
      - name: Get Code
        uses: actions/checkout@v4
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ env.CACHE_KEY }}-${{ hashFiles('**/package-lock.json') }}
      - name: Show Node/NPM versions
        run: |
          node --version
          npm --version
      - name: Debug
        run: |
          pwd
          ls -la
      - name: Install dependencies
        run: |
          cd "Section8 - StartingProject"
          pwd
          ls -la
          npm ci --verbose
        working-directory: "Section8 - StartingProject"
      - name: Run server
        run: npm start & npx wait-on http://127.0.0.1:$PORT # requires MongoDB Atlas to accept requests from anywhere!
        working-directory: "Section8 - StartingProject"
      - name: Run tests
        run: npm test
        working-directory: "Section8 - StartingProject"
      - name: Output information
        run: |
          echo "MONGODB_USERNAME: $MONGODB_USERNAME"
        working-directory: "Section8 - StartingProject"
  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Output information
        env:
          PORT: 3000
        run: |
          echo "MONGODB_DB_NAME: $MONGODB_DB_NAME"
          echo "MONGODB_USERNAME: $MONGODB_USERNAME"
          echo "${{ env.PORT }}"
        working-directory: "Section8 - StartingProject"
