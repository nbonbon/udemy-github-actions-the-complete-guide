name: Section 6 - Reusable Deploy Workflow
on: 
    workflow_call:
        inputs:
            artifact-name:
                description: 'Name of the artifact to download'
                required: true
                type: string
                default: 'dist-files'
            artifact-path:
                description: 'Path where the artifact should be downloaded'
                required: true
                type: string
                default: 'dist'
        # secrets:
        #     some-secret:
        #         required: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
        - name: Get code
          uses: actions/download-artifact@v8
          with:
            name: ${{ inputs.artifact-name }}
            path: ${{ inputs.artifact-path }}
        - name: List Files
          run: ls    
        - name: Output information
          run: |
            echo "Deploying & uploading ..."